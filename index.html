<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TNVSP - Town Member Register</title>
  <style>
    :root{
      --bg:#edf7ff;
      --panel:#ffffff;
      --soft:#f6fbff;
      --primary:#1976d2;
      --primary2:#0d47a1;
      --green:#2e7d32;
      --gold:#f9a825;
      --pink:#ec407a;
      --purple:#7b1fa2;
      --red:#d32f2f;
      --text:#1f2d3d;
      --muted:#607889;
      --line:#dfeaf3;
      --shadow:0 8px 24px rgba(25,118,210,0.12);
      --radius:18px;
    }

    * { box-sizing:border-box; }
    html,body{
      margin:0;
      padding:0;
      height:100%;
      background:linear-gradient(180deg,#edf8ff,#f7fbff 35%,#ffffff);
      color:var(--text);
      font-family:Segoe UI, Tahoma, Arial, sans-serif;
    }

    body{
      display:flex;
      justify-content:center;
      min-height:100vh;
    }

    #app{
      width:min(100%, 920px);
      min-height:100vh;
      padding-bottom:92px;
      background:transparent;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:rgba(255,255,255,0.96);
      backdrop-filter:blur(10px);
      border-bottom:2px solid var(--line);
      padding:12px 16px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      flex:1;
    }

    .brand-badge{
      width:40px; height:40px;
      display:grid; place-items:center;
      background:linear-gradient(135deg,var(--primary),var(--purple));
      color:white;
      border-radius:12px;
      font-weight:900;
      box-shadow:var(--shadow);
      font-size:20px;
    }

    .brand-text{
      min-width:0;
      line-height:1.1;
    }

    .brand-text strong{
      display:block;
      font-size:16px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .brand-text small{
      display:block;
      color:var(--muted);
      font-size:11px;
    }

    .langBtn{
      border:none;
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      color:white;
      font-weight:800;
      padding:10px 14px;
      border-radius:12px;
      box-shadow:var(--shadow);
      font-size:13px;
      cursor:pointer;
    }

    .statusbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 16px 8px;
      color:var(--muted);
      font-size:12px;
    }

    .syncPill{
      background:rgba(46,125,50,0.08);
      color:var(--green);
      border-radius:999px;
      padding:6px 10px;
      font-weight:800;
    }

    .hero{
      padding:0 16px 8px;
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:10px;
    }

    .stat{
      background:linear-gradient(180deg,var(--panel),var(--soft));
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      border-radius:var(--radius);
      padding:12px 10px;
      display:flex;
      flex-direction:column;
      gap:6px;
      min-height:86px;
    }

    .stat .icon{ font-size:18px; }
    .stat .num{
      font-size:22px;
      font-weight:900;
      color:var(--primary);
      line-height:1;
    }
    .stat .label{
      font-size:11px;
      font-weight:800;
      letter-spacing:0.04em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .panel{
      margin:10px 16px;
      background:linear-gradient(180deg,#fff,#f9fcff);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:14px 16px 12px;
      background:linear-gradient(135deg,#f8fbff,#edf5ff);
      border-bottom:1px solid var(--line);
    }

    .panel-title{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:15px;
      font-weight:900;
      color:var(--primary);
    }

    .mini{
      width:28px;height:28px;border-radius:8px;
      display:grid;place-items:center;
      background:rgba(25,118,210,0.10);
      color:var(--primary);
      font-size:13px;
      font-weight:900;
    }

    .badge{
      background:rgba(249,168,37,0.14);
      color:#8a5b00;
      border-radius:999px;
      padding:5px 9px;
      font-size:11px;
      font-weight:800;
    }

    .panel-body{
      padding:10px 12px 12px;
    }

    .search{
      width:100%;
      border:2px solid var(--line);
      border-radius:12px;
      background:#f7fafe;
      padding:11px 12px;
      font-size:15px;
      color:var(--text);
      margin-bottom:10px;
      outline:none;
    }

    .search:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(25,118,210,0.12);
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .item{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px 12px;
      cursor:pointer;
      transition:0.12s ease;
    }

    .item:active{ transform:scale(0.995); }

    .item.selected{
      border-color:var(--primary);
      background:rgba(25,118,210,0.05);
      box-shadow:inset 0 0 0 1px rgba(25,118,210,0.12);
    }

    .item-title{
      font-weight:800;
      font-size:15px;
      margin-bottom:4px;
      color:var(--text);
    }

    .item-sub{
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
    }

    .item-arrow{
      color:var(--primary);
      font-size:18px;
      font-weight:900;
      padding-top:2px;
    }

    .empty{
      text-align:center;
      color:var(--muted);
      padding:18px 12px 6px;
      font-size:14px;
      line-height:1.5;
    }

    .bottomBar{
      position:fixed;
      left:0; bottom:0; width:100%;
      background:rgba(255,255,255,0.98);
      border-top:2px solid var(--line);
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      box-shadow:0 -8px 24px rgba(0,0,0,0.06);
      padding-bottom:max(12px, env(safe-area-inset-bottom));
      z-index:30;
    }

    .bottomBtn{
      border:none;
      background:transparent;
      color:var(--primary);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      min-height:72px;
      font-weight:800;
      font-size:12px;
      padding:10px 8px 12px;
      cursor:pointer;
    }

    .bottomBtn .icon{
      font-size:24px;
      line-height:1;
    }

    .bottomBtn.secondary{ color:var(--pink); }
    .bottomBtn.success{ color:var(--green); }
    .bottomBtn.warning{ color:var(--gold); }

    .sheet{
      position:fixed;
      inset:0;
      background:rgba(14,23,34,0.35);
      display:none;
      align-items:flex-end;
      z-index:40;
    }

    .sheet.show{ display:flex; }

    .sheetCard{
      width:min(100%, 920px);
      max-height:86vh;
      overflow:auto;
      background:linear-gradient(180deg,#fff,#f9fbff);
      border-radius:24px 24px 0 0;
      padding:18px 16px 24px;
      box-shadow:0 -15px 35px rgba(0,0,0,0.12);
    }

    .sheetHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }

    .sheetTitle{
      color:var(--primary);
      font-weight:900;
      font-size:18px;
    }

    .closeBtn, .saveBtn, .cancelBtn{
      border:none;
      border-radius:12px;
      font-weight:800;
      padding:12px 14px;
      font-size:15px;
      cursor:pointer;
    }

    .closeBtn{
      background:#edf3ff;
      color:var(--primary);
    }

    .fieldGrid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-bottom:10px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .field.full{
      grid-column:1 / -1;
    }

    .field label{
      font-size:12px;
      font-weight:800;
      letter-spacing:0.03em;
      color:var(--muted);
      text-transform:uppercase;
    }

    input, select, textarea{
      width:100%;
      border-radius:12px;
      border:2px solid var(--line);
      background:#f7fafe;
      color:var(--text);
      padding:12px 11px;
      font-size:15px;
      outline:none;
      font-family:inherit;
    }

    input:focus, select:focus, textarea:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(25,118,210,0.12);
    }

    textarea{
      min-height:88px;
      resize:vertical;
    }

    .helper{
      min-height:14px;
      font-size:11px;
      color:var(--muted);
    }

    .helper.error{
      color:var(--red);
      font-weight:700;
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top:12px;
    }

    .cancelBtn{
      flex:1;
      background:#edf3ff;
      color:var(--primary);
    }

    .saveBtn{
      flex:1;
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      color:white;
      box-shadow:var(--shadow);
    }

    @media (max-width:640px){
      .fieldGrid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">T</div>
        <div class="brand-text">
          <strong id="appName">TNVSP</strong>
          <small id="subTitle">Town Member Register</small>
        </div>
      </div>
      <button class="langBtn" id="langToggle">தமிழ்</button>
    </header>

    <div class="statusbar">
      <span id="statusText">Ready to collect</span>
      <span class="syncPill" id="syncPill">Offline</span>
    </div>

    <section class="hero">
      <div class="stat">
        <div class="icon">🏛️</div>
        <div class="num" id="assoCount">0</div>
        <div class="label">Associations</div>
      </div>
      <div class="stat">
        <div class="icon">🏪</div>
        <div class="num" id="firmCount">0</div>
        <div class="label">Firms</div>
      </div>
      <div class="stat">
        <div class="icon">👥</div>
        <div class="num" id="repCount">0</div>
        <div class="label">Representatives</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="mini">A</span><span id="assoLabel">Associations</span></div>
        <span class="badge" id="assoBadge">0</span>
      </div>
      <div class="panel-body">
        <input id="assoSearch" class="search" type="text" placeholder="Search associations..." />
        <div id="assoList" class="list"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="mini">F</span><span id="firmLabel">Member Firms</span></div>
        <span class="badge" id="firmBadge">0</span>
      </div>
      <div class="panel-body">
        <input id="firmSearch" class="search" type="text" placeholder="Search firms..." />
        <div id="firmList" class="list"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="mini">R</span><span id="repLabel">Representatives</span></div>
        <span class="badge" id="repBadge">0</span>
      </div>
      <div class="panel-body">
        <input id="repSearch" class="search" type="text" placeholder="Search representatives..." />
        <div id="repList" class="list"></div>
      </div>
    </section>
  </div>

  <div class="bottomBar">
    <button class="bottomBtn" id="navBtn"><span class="icon">☰</span><span id="navLabel">View</span></button>
    <button class="bottomBtn secondary" id="deleteBtn"><span class="icon">🗑️</span><span id="deleteLabel">Delete</span></button>
    <button class="bottomBtn success" id="newBtn"><span class="icon">＋</span><span id="newLabel">New</span></button>
    <button class="bottomBtn warning" id="editBtn"><span class="icon">✏️</span><span id="editLabel">Edit</span></button>
  </div>

  <div id="sheet" class="sheet">
    <div class="sheetCard">
      <div class="sheetHead">
        <div id="sheetTitle" class="sheetTitle">New</div>
        <button id="closeSheet" class="closeBtn">Close</button>
      </div>
      <div id="formContainer"></div>
    </div>
  </div>

      }

    const geoOptions = ['area','town/city','district','province'];

    function t(k){ return (TA[lang] && TA[lang][k]) || k; }
    function readJSON(key, fallback){
      try{ const raw = localStorage.getItem(key); if(!raw) return fallback; return JSON.parse(raw); }catch{ return fallback; }
    }
    function writeJSON(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch{} }
    function loadLocal(){
      ASSOS = readJSON(LS_ASSO, []);
      FIRMS = readJSON(LS_FIRM, []);
      REPS = readJSON(LS_REP, []);
    }
    function getList(kind){ return kind === 'asso' ? ASSOS : kind === 'firm' ? FIRMS : REPS; }
    function getKey(kind){ return kind === 'asso' ? LS_ASSO : kind === 'firm' ? LS_FIRM : LS_REP; }
    function normalizePhone(v){ return String(v || '').replace(/\D/g,'').slice(-10); }
    function phoneExists(kind, phone, currentId){
      const num = normalizePhone(phone);
      if(!num) return false;
      return getList(kind).filter(x => x.id !== currentId).some(item => {
        const candidates = [item.assoPhone, item.firmPhone, item.repPhone1, item.repPhone2];
        return candidates.some(c => normalizePhone(c) === num);
      });
    }
    function renderStats(){
      document.getElementById('assoCount').textContent = ASSOS.length;
      document.getElementById('firmCount').textContent = FIRMS.length;
      document.getElementById('repCount').textContent = REPS.length;
      document.getElementById('assoBadge').textContent = ASSOS.length;
      document.getElementById('firmBadge').textContent = FIRMS.length;
      document.getElementById('repBadge').textContent = REPS.length;
    }
    function nameOf(kind,id){
      const item = getList(kind).find(x => x.id === id);
      return item ? (item.assoName || item.firmName || item.repName || '') : '';
    }
    function showStatus(msg){ document.getElementById('statusText').textContent = msg; }
    function renderList(kind){
      const container = document.getElementById(kind + 'List');
      const q = document.getElementById(kind + 'Search').value.trim().toLowerCase();
      const list = getList(kind).filter(item => {
        const title = item.assoName || item.firmName || item.repName || '';

        return title.toLowerCase().includes(q) || extra.includes(q);
      });
      if(!list.length){ container.innerHTML = `<div class="empty">${kind === 'asso' ? t('noAssoc') : kind === 'firm' ? t('noFirm') : t('noRep')}</div>`; return; }
      container.innerHTML = list.map(item => {
        const title = item.assoName || item.firmName || item.repName || 'Untitled';
        const sub = kind === 'asso' ? [item.assoPhone, item.assoGeoScope].filter(Boolean).join(' • ') : kind === 'firm' ? [item.firmP
