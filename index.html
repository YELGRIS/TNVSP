<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Traders Association</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.js"></script>
<style>
:root{
  --bg:#E3F2FD; --panel:#FFFFFF; --input-bg:#F5FAFF; --accent:#1976D2;
  --text:#263238; --error:#D32F2F; --ok:#2E7D32; --muted:#607889;
  --g1:#1976D2; --g2:#00897B; --g3:#6A1B9A; --g4:#C2185B; --g5:#EF6C00; --g6:#2E7D32;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);font-size:15px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px}
#app{display:flex;flex-direction:column;min-height:100vh}
#panels{flex:1;padding:6px 6px 3px}
.panel{background:var(--panel);border-radius:14px;margin-bottom:6px;overflow:hidden;transition:max-height .25s ease;box-shadow:0 2px 6px rgba(0,0,0,.10);border:1px solid #e3eaf0}
.panel-header{padding:10px 12px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:var(--accent)}
.panel-sub{font-size:12px;font-weight:400;color:var(--muted);display:block;margin-top:2px}
.panel-body{display:none;padding:2px 8px 10px}
.panel.expanded .panel-body{display:block}
.panel.collapsed .panel-header{border-bottom:none}
input[type=text],input[type=email],input[type=date],select,textarea{width:100%;font-size:15px;padding:7px 9px;margin:2px 0 0;border-radius:10px;border:2px solid #cfd8dc;background:var(--input-bg);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(25,118,210,.15)}
input.err,select.err{border-color:var(--error) !important}
.field-grid{display:flex;flex-wrap:wrap;gap:3px 6px;align-items:flex-start}
.field{margin-bottom:3px;position:relative;min-width:60px;transition:transform .15s ease,box-shadow .15s ease}
.field:focus-within{transform:scale(1.04);box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:10;background:var(--panel);border-radius:6px}
.field.full{flex:1 1 100%;width:100%}
.field label{font-size:12px;font-weight:700;line-height:1.2;display:block}
.errmsg{color:var(--error);font-size:11px;min-height:14px;display:block;line-height:1.35;font-weight:600}
.okmsg{color:var(--ok);font-size:11px;min-height:14px;display:block;line-height:1.35}
.row2{display:flex;gap:6px}
.row2 .field{flex:1}
.searchbox{width:100%;font-size:15px;padding:7px 9px;border-radius:10px;border:2px solid #cfd8dc;margin:5px 0;background:var(--input-bg)}
.list-row{padding:8px 6px;border-bottom:1px solid #eceff1;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.list-row:active{background:#f0f4f8}
.list-row .lr-name{font-weight:700;font-size:14px}
.list-row .lr-sub{font-size:12px;color:var(--muted)}
.list-row.selected{background:var(--accent);border-left:5px solid var(--accent)}
.list-row.selected .lr-name{color:#fff}
.list-row.selected .lr-sub{color:#eaf3ff}
.empty-note{padding:14px;color:var(--muted);font-size:14px;text-align:center}
.data-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:3px}
.data-table thead th{background:var(--accent);color:#fff;text-align:left;padding:8px 6px;font-size:13px;font-weight:700}
.data-table thead th:first-child{border-radius:8px 0 0 0}
.data-table thead th:last-child{border-radius:0 8px 0 0}
.data-table tbody .list-row{display:table-row;cursor:pointer;border-bottom:1px solid #eceff1}
.data-table tbody .list-row td{padding:8px 6px;font-size:14px}
.data-table tbody .list-row td:first-child{font-weight:700;color:var(--g1)}
.data-table tbody .list-row td:last-child{color:var(--g3)}
.data-table tbody .list-row:nth-child(even){background:#f7fafd}
.data-table tbody .list-row:active{background:#eef3fb}
.data-table tbody .list-row.selected{background:var(--accent)}
.data-table tbody .list-row.selected td{color:#fff}
.data-table tbody .list-row.selected td:first-child{color:#fff;border-left:5px solid #fff}
.field[data-grp=g1] label{color:var(--g1)}
.field[data-grp=g1] input,.field[data-grp=g1] select,.field[data-grp=g1] textarea,.field[data-grp=g1] .choicebox{border-color:var(--g1);color:var(--g1)}
.field[data-grp=g2] label{color:var(--g2)}
.field[data-grp=g2] input,.field[data-grp=g2] select,.field[data-grp=g2] textarea,.field[data-grp=g2] .choicebox{border-color:var(--g2);color:var(--g2)}
.field[data-grp=g3] label{color:var(--g3)}
.field[data-grp=g3] input,.field[data-grp=g3] select,.field[data-grp=g3] textarea,.field[data-grp=g3] .choicebox{border-color:var(--g3);color:var(--g3)}
.field[data-grp=g4] label{color:var(--g4)}
.field[data-grp=g4] input,.field[data-grp=g4] select,.field[data-grp=g4] textarea,.field[data-grp=g4] .choicebox{border-color:var(--g4);color:var(--g4)}
.field[data-grp=g5] label{color:var(--g5)}
.field[data-grp=g5] input,.field[data-grp=g5] select,.field[data-grp=g5] textarea,.field[data-grp=g5] .choicebox{border-color:var(--g5);color:var(--g5)}
.field[data-grp=g6] label{color:var(--g6)}
.field[data-grp=g6] input,.field[data-grp=g6] select,.field[data-grp=g6] textarea,.field[data-grp=g6] .choicebox{border-color:var(--g6);color:var(--g6)}
.suggest-box{position:absolute;left:0;right:0;top:100%;background:var(--panel);border:2px solid var(--accent);border-radius:10px;max-height:190px;overflow-y:auto;z-index:50;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.choice-box{position:absolute;left:0;right:0;top:100%;background:var(--panel);border:2px solid var(--accent);border-radius:10px;max-height:220px;overflow-y:auto;z-index:55;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.choice-row{padding:9px 10px;font-size:14px;cursor:pointer;border-bottom:1px solid #eceff1;line-height:1.3}
.choice-row:last-child{border-bottom:none}
.choice-row:active{background:#eef3fb}
.choice-row.current{color:var(--accent);font-weight:700}
.suggest-row{padding:6px 8px;font-size:13px;cursor:pointer;border-bottom:1px solid #eceff1;line-height:1.35}
.suggest-row:last-child{border-bottom:none}
.suggest-row:active{background:#eef3fb}
.suggest-row b{color:var(--accent)}
.suggest-row small{color:var(--muted);display:block;font-size:11px}
.photo-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.photo-click-area{width:90px;height:120px;border-radius:6px;border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:var(--input-bg)}
.photo-click-area.disabled{cursor:default;border-style:solid}
.photo-click-area .photo-preview{width:100%;height:100%;object-fit:cover;border-radius:0;border:none}
.photo-placeholder{font-size:20px;text-align:center;color:var(--muted);line-height:1.3}
.photo-placeholder span{display:block;font-size:10px;margin-top:2px}
.photo-remove{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--g4);color:var(--g4);background:none}
.photo-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:10px}
.photo-modal-box{background:var(--panel);border-radius:14px;width:100%;max-width:95vw;max-height:92vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.photo-modal-header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #e3eaf0;font-weight:700;font-size:15px;color:var(--accent)}
.photo-modal-x{background:none;border:none;font-size:20px;line-height:1;color:var(--muted);padding:2px 8px;cursor:pointer}
.photo-modal-body{padding:10px 12px}
.photo-modal-choose-row{display:flex;gap:8px}
.photo-src-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:16px 6px;border-radius:12px;border:2px solid var(--accent);background:var(--input-bg);color:var(--accent);cursor:pointer;font-size:26px}
.photo-src-btn span{font-size:11px;font-weight:700}
#photoCroppieEl{width:100%;max-width:320px;margin:0 auto}
.photo-modal-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.photo-modal-actions button{flex:1;min-width:120px;padding:9px;border-radius:9px;border:none;font-weight:700;font-size:13px}
#photoModalUseBtn{background:var(--accent);color:#fff}
#photoModalRetakeBtn{background:#eceff1;color:var(--text)}
.photo-modal-footer{padding:8px 12px;border-top:1px solid #e3eaf0;text-align:right}
#photoModalCancelBtn{background:none;border:none;color:var(--error);font-weight:700;padding:6px 8px;cursor:pointer}
.ta-name-box{position:relative}
.ta-chips{display:flex;flex-wrap:wrap;gap:5px;min-height:32px;align-items:center;padding:3px 0}
.ta-chip{display:inline-block;padding:5px 10px;border-radius:16px;background:var(--input-bg);border:2px solid var(--accent);color:var(--accent);font-weight:700;font-size:13px;cursor:pointer}
.ta-chip.active{background:var(--accent);color:#fff}
.ta-chip-empty{color:var(--muted);font-size:12px;font-style:italic}
.ta-popup-inline{position:absolute;left:0;right:0;top:100%;margin-top:3px;background:var(--panel);border:2px solid var(--accent);border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.18);z-index:60;padding:6px}
.ta-popup-strip{display:flex;overflow-x:auto;gap:5px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.ta-cand-pill{flex:0 0 auto;padding:5px 10px;border-radius:16px;background:var(--input-bg);border:1px solid var(--accent);color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
.ta-cand-pill.best{background:var(--accent);color:#fff}
.ta-cand-empty{color:var(--muted);font-size:11px;white-space:nowrap;padding:5px 2px}
.ta-popup-editrow{display:flex;gap:5px;align-items:center}
.ta-popup-input{flex:1;min-width:0;font-size:15px;padding:6px;border-radius:6px;border:1px solid #cfd8dc;box-sizing:border-box}
.ta-popup-btn{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:none;font-weight:700;font-size:15px;cursor:pointer;background:#eceff1;color:var(--text)}
.ta-popup-done{background:var(--accent);color:#fff}
#eventLog{position:relative;background:var(--panel);border-top:2px solid #e3eaf0}
#eventLogHistory{max-height:200px;overflow-y:auto;padding:5px 10px;border-bottom:1px solid #eceff1}
#eventLogHistory .log-item{font-size:12px;padding:3px 0;border-bottom:1px dashed #eceff1;color:var(--text)}
#logLineClickable{padding:5px 6px 5px 10px;font-size:12px;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:5px}
#eventLogPreview{flex:1;min-width:0}
.log-preview-item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--muted);line-height:1.35}
#logLineClickable .logtoggle{color:var(--accent);font-weight:700}
.hint{color:var(--muted);font-size:11px;min-height:14px;display:block;line-height:1.35}
#actionRow{display:flex;gap:4px;padding:4px 5px;background:var(--panel);border-top:2px solid var(--accent);flex-wrap:nowrap}
#actionRow button{flex:1;min-width:0;min-height:46px;border:2px solid #fff;border-radius:12px;font-weight:800;font-size:16px;padding:8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.28),inset 0 -3px 8px rgba(0,0,0,.18);transition:transform .09s ease,box-shadow .09s ease;}
#actionRow button:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 4px rgba(0,0,0,.22),inset 0 -1px 3px rgba(0,0,0,.12);}
#actionRow button:nth-child(1){background:#1976D2;color:#fff;}
#actionRow button:nth-child(2){background:#EF6C00;color:#fff;}
#actionRow button:nth-child(3){background:#2E7D32;color:#fff;}
#actionRow button:nth-child(4){background:#F9A825;color:#263238;}
#actionRow button:nth-child(5){background:#D32F2F;color:#fff;}
#spacePopup{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.space-popup-box{background:var(--panel);border-radius:12px;min-width:200px;max-width:85vw;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.space-popup-item{padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;border-bottom:1px solid #eceff1;min-height:40px;display:flex;align-items:center}
.space-popup-item:last-child{border-bottom:none}
.space-popup-item.current{color:var(--accent)}
.space-popup-item:active{background:#eef3fb}
#a11yToggleBtn{position:fixed;right:6px;top:50%;transform:translateY(-50%);z-index:120;border:none;border-radius:20px;padding:6px 10px;background:var(--panel);border:2px solid var(--accent);color:var(--accent);font-weight:700;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.age-label{font-size:12px;color:var(--accent);font-weight:700}
.badge{display:inline-block;padding:2px 7px;border-radius:8px;font-size:11px;font-weight:700;background:#fff3cd;color:#856404}
.choicebox{cursor:pointer;background:var(--input-bg);caret-color:transparent}
.choicebox::placeholder{color:var(--muted)}
</style>
</head>
<body>
<div id="a11yAnnouncer" aria-live="polite" class="sr-only"></div>
<div id="app">
  <div id="panels"></div>
  <div id="actionRow"></div>
  <div id="spacePopup" style="display:none"></div>
  <div id="eventLog">
    <div id="eventLogHistory" style="display:none"></div>
    <div id="logLineClickable">
      <div id="eventLogPreview" class="log-preview"><div class="log-preview-item">Ready.</div></div>
      <span class="logtoggle" id="logToggleIcon">▼</span>
    </div>
  </div>
  <button type="button" id="a11yToggleBtn" class="a11y-toggle-btn">🔇 OFF</button>
  <div id="photoModalOverlay" class="photo-modal-overlay" style="display:none">
    <div class="photo-modal-box">
      <div class="photo-modal-header">
        <span>Update Photo</span>
        <button type="button" id="photoModalClose" class="photo-modal-x">✕</button>
      </div>
      <div class="photo-modal-body">
        <div id="photoModalChooseHolder" class="photo-modal-choose-row">
          <button type="button" id="photoModalChooseFileBtn" class="photo-src-btn"><span>📁</span><span>Choose from Device</span></button>
          <button type="button" id="photoModalChooseCameraBtn" class="photo-src-btn"><span>📷</span><span>Take Selfie</span></button>
        </div>
        <input type="file" id="photoModalFileInput" accept="image/*" style="display:none">
        <input type="file" id="photoModalCameraInput" accept="image/*" capture="user" style="display:none">
        <div id="photoModalCroppieHolder" style="display:none">
          <div id="photoCroppieEl"></div>
          <div class="photo-modal-actions">
            <button type="button" id="photoModalUseBtn">Use This Photo</button>
            <button type="button" id="photoModalRetakeBtn">Retake / Change</button>
          </div>
        </div>
      </div>
      <div class="photo-modal-footer">
        <button type="button" id="photoModalCancelBtn">Cancel</button>
      </div>
    </div>
  </div>
</div>
<script type="module">
</script>
</body>
</html>
